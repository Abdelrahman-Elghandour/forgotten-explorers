  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap');
    
    html, body, #root {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #040711;
      color: #f1f5f9;
      overflow: hidden;
      font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }

    .glass {
      background: rgba(10, 14, 28, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .glass-card {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.88) 0%, rgba(7, 11, 24, 0.96) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .acc { color: var(--c, #8bd3ff); }
    .accbg { background: var(--c, #8bd3ff); color: #05070d; }
    .accbd { border-color: var(--c, #8bd3ff); }

    /* CRT Scanlines & Static */
    .crt-scanlines {
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.45) 50%),
                  linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
    }

    @keyframes glitchDisplace {
      0% { transform: translate(0, 0); }
      20% { transform: translate(-5px, 3px); }
      40% { transform: translate(5px, -3px); }
      60% { transform: translate(-4px, -2px); }
      80% { transform: translate(4px, 4px); }
      100% { transform: translate(0, 0); }
    }
    .glitch-active { animation: glitchDisplace 0.1s infinite; }

    @keyframes pulseBeacon {
      0%, 100% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.9); }
      50% { transform: scale(1.3); opacity: 0.8; box-shadow: 0 0 35px 12px rgba(239, 68, 68, 0.5); }
    }
    .pulse-beacon { animation: pulseBeacon 1.8s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

    @keyframes transmittingBorder {
      0%, 100% { border-color: rgba(34, 211, 238, 0.9); box-shadow: 0 0 25px rgba(34, 211, 238, 0.6); }
      50% { border-color: rgba(245, 158, 11, 0.9); box-shadow: 0 0 30px rgba(245, 158, 11, 0.7); }
    }
    .transmitting-active { animation: transmittingBorder 1.5s ease-in-out infinite; }

    @keyframes glow {
      0%, 100% { text-shadow: 0 0 20px #7c5cff; }
      50% { text-shadow: 0 0 44px #38bdf8; }
    }

    @keyframes fin {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }
    .fin { animation: fin 0.7s cubic-bezier(0.16, 1, 0.3, 1) both; }

    @keyframes wp {
      0% { opacity: 0; transform: scale(0.4); }
      40% { opacity: 1; }
      100% { opacity: 0; transform: scale(5); }
    }

    @keyframes waveBar {
      0%, 100% { height: 18%; }
      50% { height: 95%; }
    }

    /* Scene 4: Spark Burst & Lens Rays */
    @keyframes sparkBurst {
      0% { transform: scale(0.1); opacity: 0; filter: brightness(1); }
      25% { transform: scale(1.8); opacity: 1; filter: brightness(4); }
      60% { transform: scale(2.4); opacity: 0.95; filter: brightness(2.5); }
      100% { transform: scale(4.2); opacity: 0; filter: brightness(1); }
    }
    .spark-burst { animation: sparkBurst 1.1s cubic-bezier(0.1, 0.9, 0.2, 1) forwards; }

    @keyframes lensRay {
      0% { transform: scaleX(0.1); opacity: 0; }
      35% { transform: scaleX(1.8); opacity: 1; }
      100% { transform: scaleX(3.2); opacity: 0; }
    }
    .lens-ray { animation: lensRay 1.1s cubic-bezier(0.1, 0.9, 0.2, 1) forwards; }

    /* Anamorphic letterbox bars */
    .cinematic-bars::before, .cinematic-bars::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 7.5vh;
      background: #000;
      z-index: 25;
      pointer-events: none;
    }
    .cinematic-bars::before { top: 0; border-bottom: 1px solid rgba(255, 255, 255, 0.12); }
    .cinematic-bars::after { bottom: 0; border-top: 1px solid rgba(255, 255, 255, 0.12); }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    // Polyfill for localStorage storage
    if (!window.storage) {
      window.storage = {
        get: async (key) => {
          try {
            const val = localStorage.getItem("fe_" + key);
            return val !== null ? { value: val } : null;
          } catch (e) {
            return null;
          }
        },
        set: async (key, val) => {
          try {
            localStorage.setItem("fe_" + key, val);
          } catch (e) {}
        }
      };
    }
  </script>

  <script type="text/babel">
    /* @jsxRuntime classic */
    const { useState, useMemo, useRef, useEffect } = React;

    /* ============ INLINE ICONS ============ */
    const Icon = ({ size = 20, className = "", children }) => (
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width={size}
        height={size}
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        strokeWidth="2"
        strokeLinecap="round"
        strokeLinejoin="round"
        className={className}
      >
        {children}
      </svg>
    );

    const Volume2 = (p) => <Icon {...p}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></Icon>;
    const VolumeX = (p) => <Icon {...p}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/></Icon>;
    const Square = (p) => <Icon {...p}><rect width="18" height="18" x="3" y="3" rx="2"/></Icon>;
    const Rocket = (p) => <Icon {...p}><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></Icon>;
    const Clock = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></Icon>;
    const Trophy = (p) => <Icon {...p}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></Icon>;
    const Radio = (p) => <Icon {...p}><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/><path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"/><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"/><path d="M19.1 4.9C23 8.8 23 15.1 19.1 19"/></Icon>;
    const Sun = (p) => <Icon {...p}><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></Icon>;
    const Camera = (p) => <Icon {...p}><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></Icon>;
    const X = (p) => <Icon {...p}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></Icon>;
    const Award = (p) => <Icon {...p}><path d="m15.477 12.89 1.515 8.526a.5.5 0 0 1-.81.47l-3.58-2.687a1 1 0 0 0-1.197 0l-3.586 2.686a.5.5 0 0 1-.81-.469l1.514-8.526"/><circle cx="12" cy="8" r="6"/></Icon>;
    const ArrowRight = (p) => <Icon {...p}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></Icon>;
    const ArrowLeft = (p) => <Icon {...p}><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></Icon>;
    const Languages = (p) => <Icon {...p}><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></Icon>;
    const Download = (p) => <Icon {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></Icon>;
    const Eye = (p) => <Icon {...p}><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></Icon>;
    const Database = (p) => <Icon {...p}><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></Icon>;
    const Play = (p) => <Icon {...p}><polygon points="5 3 19 12 5 21 5 3"/></Icon>;
    const Pause = (p) => <Icon {...p}><line x1="10" y1="4" x2="10" y2="20"/><line x1="14" y1="4" x2="14" y2="20"/></Icon>;
    const Activity = (p) => <Icon {...p}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></Icon>;
    const FileText = (p) => <Icon {...p}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></Icon>;
    const ExternalLink = (p) => <Icon {...p}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></Icon>;
    const Compass = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></Icon>;
    const Zap = (p) => <Icon {...p}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></Icon>;

    /* ============ AUDIO ENGINE ============ */
    let ctx = null, solarAmb = null, staticNoiseNode = null, staticGainNode = null;
    let windNode = null, windGain = null, motorOsc = null, motorGain = null;

    const ac = () => {
      ctx ||= new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === "suspended") ctx.resume();
      return ctx;
    };

    function tone(f, d = 0.15, type = "sine", t0 = 0, vol = 0.1, f2) {
      try {
        const a = ac(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0;
        o.type = type; o.frequency.setValueAtTime(f, t);
        if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + d);
        o.connect(g).connect(a.destination);
        o.start(t); o.stop(t + d);
      } catch (e) {}
    }

    const sfx = {
      click: () => tone(880, 0.08, "square", 0, 0.04, 1320),
      planet: () => { tone(110, 1, "sawtooth", 0, 0.06, 440); tone(220, 1, "sine", 0.05, 0.08, 880); },
      pip: () => tone(1180, 0.08, "sine", 0, 0.03, 880),
      win: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.25, "triangle", i * 0.14, 0.12)),
      bad: () => tone(200, 0.3, "sawtooth", 0, 0.08, 100),
    };

    function ambient(on) {
      try {
        const a = ac();
        if (on && !solarAmb) {
          const g = a.createGain(); g.gain.value = 0.035;
          const o1 = a.createOscillator(), o2 = a.createOscillator(), l = a.createOscillator(), lg = a.createGain();
          o1.frequency.value = 55; o2.type = "triangle"; o2.frequency.value = 82.4; l.frequency.value = 0.08; lg.gain.value = 0.015;
          l.connect(lg).connect(g.gain);
          o1.connect(g); o2.connect(g); g.connect(a.destination);
          [o1, o2, l].forEach((o) => o.start());
          solarAmb = { g, os: [o1, o2, l] };
        } else if (!on && solarAmb) {
          solarAmb.os.forEach((o) => { try { o.stop(); } catch (e) {} });
          solarAmb.g.disconnect();
          solarAmb = null;
        }
      } catch (e) {}
    }

    function setAudioDucking(duck) {
      if (solarAmb && ctx) {
        try {
          const target = duck ? 0.008 : 0.035;
          solarAmb.g.gain.linearRampToValueAtTime(target, ctx.currentTime + 0.3);
        } catch (e) {}
      }
    }

    /* 1. Procedural Martian Atmospheric Wind */
    function startMarsWind(vol = 0.075) {
      try {
        const a = ac();
        stopMarsWind();
        const bufferSize = a.sampleRate * 2.5;
        const buffer = a.createBuffer(1, bufferSize, a.sampleRate);
        const data = buffer.getChannelData(0);
        let b0 = 0, b1 = 0, b2 = 0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          b0 = 0.99886 * b0 + white * 0.0555179;
          b1 = 0.99332 * b1 + white * 0.0750759;
          b2 = 0.96900 * b2 + white * 0.1538520;
          data[i] = (b0 + b1 + b2) * 0.45;
        }
        const noise = a.createBufferSource();
        noise.buffer = buffer;
        noise.loop = true;

        const filter = a.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(240, a.currentTime);
        filter.Q.value = 2.2;

        const lfo = a.createOscillator();
        lfo.frequency.value = 0.15;
        const lfoGain = a.createGain();
        lfoGain.gain.value = 140;
        lfo.connect(lfoGain).connect(filter.frequency);
        lfo.start();

        const gain = a.createGain();
        gain.gain.setValueAtTime(0.001, a.currentTime);
        gain.gain.linearRampToValueAtTime(vol, a.currentTime + 1.2);

        noise.connect(filter).connect(gain).connect(a.destination);
        noise.start();
        windNode = noise;
        windGain = gain;
      } catch (e) {}
    }

    function stopMarsWind() {
      if (windGain && ctx) {
        try {
          windGain.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + 0.4);
          setTimeout(() => {
            if (windNode) { try { windNode.stop(); windNode.disconnect(); } catch (e) {} }
            windNode = null; windGain = null;
          }, 450);
        } catch (e) {}
      }
    }

    /* 2. Mechanical Rover Drive Motor Whine */
    function startRoverEngine(vol = 0.038) {
      try {
        const a = ac();
        stopRoverEngine(false);
        const osc = a.createOscillator();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(75, a.currentTime);
        
        const filter = a.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.value = 320;

        const gain = a.createGain();
        gain.gain.setValueAtTime(0.001, a.currentTime);
        gain.gain.linearRampToValueAtTime(vol, a.currentTime + 0.8);

        osc.connect(filter).connect(gain).connect(a.destination);
        osc.start();
        motorOsc = osc;
        motorGain = gain;
      } catch (e) {}
    }

    function stopRoverEngine(pitchDown = true) {
      if (motorOsc && motorGain && ctx) {
        try {
          const now = ctx.currentTime;
          if (pitchDown) {
            motorOsc.frequency.exponentialRampToValueAtTime(20, now + 1.1);
          }
          motorGain.gain.linearRampToValueAtTime(0.0001, now + 1.1);
          setTimeout(() => {
            if (motorOsc) { try { motorOsc.stop(); motorOsc.disconnect(); } catch (e) {} }
            motorOsc = null; motorGain = null;
          }, 1150);
        } catch (e) {}
      }
    }

    /* 3. Power-Down Electrical Relay Click & Shutdown Whine */
    function playPowerDownSfx() {
      try {
        const a = ac();
        const now = a.currentTime;
        tone(1200, 0.025, "square", 0, 0.07, 400); // Relay click 1
        const osc = a.createOscillator(), g = a.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(580, now);
        osc.frequency.exponentialRampToValueAtTime(25, now + 0.95);
        g.gain.setValueAtTime(0.12, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.95);
        osc.connect(g).connect(a.destination);
        osc.start(now);
        osc.stop(now + 0.95);
        setTimeout(() => tone(750, 0.03, "square", 0, 0.06, 180), 240); // Relay click 2
      } catch (e) {}
    }

    function playBatteryLowBeep() {
      try {
        tone(1880, 0.06, "sine", 0, 0.06);
        tone(1880, 0.06, "sine", 0.12, 0.06);
      } catch (e) {}
    }

    function startStaticNoise(vol = 0.06) {
      try {
        const a = ac();
        stopStaticNoise();
        const bufferSize = a.sampleRate * 2;
        const buffer = a.createBuffer(1, bufferSize, a.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.8;
        const noise = a.createBufferSource();
        noise.buffer = buffer;
        noise.loop = true;
        const filter = a.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.value = 1850;
        filter.Q.value = 2.5;
        const gain = a.createGain();
        gain.gain.setValueAtTime(0.001, a.currentTime);
        gain.gain.linearRampToValueAtTime(vol, a.currentTime + 0.2);
        noise.connect(filter).connect(gain).connect(a.destination);
        noise.start();
        staticNoiseNode = noise;
        staticGainNode = gain;
      } catch (e) {}
    }

    function stopStaticNoise() {
      try {
        if (staticGainNode && ctx) {
          staticGainNode.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + 0.15);
          setTimeout(() => {
            if (staticNoiseNode) {
              try { staticNoiseNode.stop(); staticNoiseNode.disconnect(); } catch (e) {}
              staticNoiseNode = null;
            }
            staticGainNode = null;
          }, 180);
        }
      } catch (e) {}
    }

    function playRadioSquelch() {
      try {
        const a = ac();
        const now = a.currentTime;
        const bufferSize = a.sampleRate * 0.035;
        const buffer = a.createBuffer(1, bufferSize, a.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = a.createBufferSource();
        noise.buffer = buffer;
        const filter = a.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.value = 2400;
        const gain = a.createGain();
        gain.gain.setValueAtTime(0.07, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
        noise.connect(filter).connect(gain).connect(a.destination);
        noise.start(now);
      } catch (e) {}
    }

    function playGlitchBurst() {
      try {
        const a = ac();
        const now = a.currentTime;
        const bufferSize = a.sampleRate * 1.2;
        const buffer = a.createBuffer(1, bufferSize, a.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
        const noise = a.createBufferSource();
        noise.buffer = buffer;
        const filter = a.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(3400, now);
        filter.frequency.exponentialRampToValueAtTime(300, now + 1.2);
        const gain = a.createGain();
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.linearRampToValueAtTime(0.001, now + 1.2);
        noise.connect(filter).connect(gain).connect(a.destination);
        noise.start(now);
      } catch (e) {}
    }

    function playSparkSound() {
      try {
        const a = ac();
        const now = a.currentTime;
        const o1 = a.createOscillator(), g1 = a.createGain();
        o1.type = "sine";
        o1.frequency.setValueAtTime(1760, now);
        o1.frequency.exponentialRampToValueAtTime(3520, now + 0.35);
        g1.gain.setValueAtTime(0.16, now);
        g1.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
        o1.connect(g1).connect(a.destination);
        o1.start(now);
        o1.stop(now + 1.2);

        const o2 = a.createOscillator(), g2 = a.createGain();
        o2.type = "sawtooth";
        o2.frequency.setValueAtTime(520, now);
        o2.frequency.exponentialRampToValueAtTime(60, now + 0.22);

            .then(() => {
              setIsPlaying(true);
              if (!muted) {
                setVideoMuted(false);
                setAudioUnlocked(true);

            })
            .catch(() => {

    }

    /* ============ MAIN APPLICATION CONTROLLER ============ */
    function ForgottenExplorers() {

        const interval = setInterval(() => {

            utter.lang = en ? "en-US" : "ar-SA";
            utter.rate = 0.96;

            utter.onend = () => {
              setIsStoryVoPlaying(false);
              setActiveStoryVoId(null);
              setAudioDucking(false);
            };
            window.speechSynthesis.speak(utter);
          }
        };

          if ("speechSynthesis" in window) {
            const utter = new SpeechSynthesisUtterance(robot.storyTranscript[lang]);
            utter.lang = en ? "en-US" : "ar-SA";
            utter.rate = 0.96;
            utter.pitch = 1.05;
            utter.onend = () => {

                      </button>
                      <button className={btn} onClick={() => setModal("src")}>
                        <Database size={15} /> <span className="hidden sm:inline">{isArabic ? "المصادر" : "Sources"}</span>
                      </button>

                            {isArabic ? "قريبًا | Coming Soon" : "Coming Soon"}
                          </span>
                        )}
                      </div>
                    </div>

                  {/* "Coming Soon" Toast for other planets */}

                          <ExternalLink size={12} />

                        </a>

                        <a href="https://images.nasa.gov/" target="_blank" rel="noreferrer" className="text-cyan-400 hover:underline flex items-center gap-1.5">
                          <ExternalLink size={12} />
                          <span>NASA Image and Video Library</span>
                        </a>
                      </li>
                      <li>
                        <a href="https://lroc.asu.edu/" target="_blank" rel="noreferrer" className="text-cyan-400 hover:underline flex items-center gap-1.5">
                          <ExternalLink size={12} />
                          <span>Lunar Reconnaissance Orbiter Camera (Apollo/Surveyor Sites)</span>
                        </a>
                      </li>
                    </ul>
                    <p className="text-[11px] text-slate-400 pt-2 border-t border-white/10">
                      NASA Space Apps Challenge 2026 · "Abandoned but not Forgotten".
                    </p>
                  </div>
                </div>
              )}

                    <button onClick={() => setModal(null)} className="absolute top-4 end-4 glass p-1.5 rounded-full hover:bg-white/20">
                      <X size={18} />
                    </button>

                    {!done ? (
                      <div className="space-y-4">
                        <div className="flex items-center justify-between">
                          <h3 className="text-lg font-extrabold flex items-center gap-2 text-amber-300">
                            <Trophy size={18} />
                            <span>{isArabic ? "اختبار آثار الفضاء 2026" : "Space Archaeology Quiz"}</span>

                        </div>

                        <p className="text-base font-bold text-slate-100 pt-2 leading-relaxed" dir="rtl">
                          {["كم رحلة جوية أنجزتها مروحية إنجينويتي على المريخ؟", "ما الذي استعاده رواد أبولو 12 من سيرفيور 3؟", "ما اسم الروفر الصغير الذي هبط مع باثفايندر في 1997؟", "ما الجهاز الذي ما زال يعكس أشعة ليزر الأرض من القمر؟", "ما الذي أوقف مسبار إنسايت في 2022؟"][qi]}

                            ["تراكم الغبار على الألواح الشمسية", "عاصفة ثلجية", "اصطدام نيزكي"]

                                className={`w-full text-start p-3 rounded-xl border text-sm font-medium transition ${

                              type="text"
                              value={name}
                              onChange={(e) => setName(e.target.value)}
                              placeholder={isArabic ? "اكتب اسمك للشهادة" : "Enter your name"}
                              className="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-center font-bold text-white focus:outline-none focus:border-cyan-400"
                            />
                            <button
                              onClick={() => {
                                const c = document.createElement("canvas"); c.width = 1200; c.height = 800; const g = c.getContext("2d");
                                const bg = g.createLinearGradient(0, 0, 1200, 800); bg.addColorStop(0, "#0b1226"); bg.addColorStop(1, "#040711");
                                g.fillStyle = bg; g.fillRect(0, 0, 1200, 800); g.strokeStyle = "#38bdf8"; g.lineWidth = 6; g.strokeRect(30, 30, 1140, 740);
                                g.fillStyle = "#fff"; g.textAlign = "center"; g.font = "800 52px Tajawal, sans-serif";
                                g.fillText("شهادة مستكشف آثار الفضاء الرسمية", 600, 220);
                                g.font = "800 60px Tajawal, sans-serif"; g.fillStyle = "#38bdf8"; g.fillText(name || "Space Explorer", 600, 390);
                                g.fillStyle = "#facc15"; g.font = "700 34px Tajawal, sans-serif"; g.fillText(`${score} / 5 - NASA Space Apps 2026`, 600, 480);
                                const a = document.createElement("a"); a.href = c.toDataURL("image/png"); a.download = "Certificate.png"; a.click();
                              }}
                              className="w-full accbg py-3 rounded-xl font-extrabold flex items-center justify-center gap-2 shadow-lg"
                            >
                              <Download size={16} />
                              <span>{isArabic ? "تحميل الشهادة الرسمية (PNG)" : "Download Certificate"}</span>
                            </button>
                          </div>
                        )}
                        <button onClick={() => { setQi(0); setScore(0); setPick(null); setDone(false); }} className={btn + " mx-auto mt-2"}>
                          <Rocket size={16} /> {isArabic ? "أعد الاختبار" : "Retake"}
                        </button>
                      </div>
                    )}
                  </div>
                </div>
              )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<ForgottenExplorers />);
  </script>
</body>
</html>
