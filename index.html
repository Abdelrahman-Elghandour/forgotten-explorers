    if (!window.storage) {
      window.storage = {
        get: async (key) => {
          try {
            const val = localStorage.getItem("fe_" + key);
            return val !== null ? { value: val } : null;
          } catch (e) {
            return null;
          }
        },
        set: async (key, val) => {
          try {
            localStorage.setItem("fe_" + key, val);
          } catch (e) {}
        }

/* ============ CRAFT MEDIA STAGE ============ */
/* Multi-media stage for a selected craft.
 *
 * Replaces the single still with a carousel of real NASA photographs and mission footage from
 * images-api.nasa.gov. Photos and videos are searched separately (the API takes one media_type
 * per request), and a video's playable file is derived from its own asset path — the manifest
 * JSON is not CORS-readable from the browser, so ~small/~mobile/~preview/~orig are tried in turn.
 * A thumbnail filmstrip allows manual browsing, and the slideshow advances on its own until the
 * visitor picks a slide or plays a video.
 */
(function () {
  const React = window.React;
  if (!React) return;
  const { useCallback, useEffect, useMemo, useRef, useState } = React;
  const h = React.createElement;

  const formatVideoTime = (seconds) => {
    const value = Number.isFinite(seconds) && seconds > 0 ? Math.floor(seconds) : 0;
    const minutes = Math.floor(value / 60);
    const secs = String(value % 60).padStart(2, "0");
    return `${minutes}:${secs}`;
  };

  function CraftVideoControls({ videoRef, videoSrc, en, title }) {
    const [playing, setPlaying] = useState(false);
    const [current, setCurrent] = useState(0);
    const [duration, setDuration] = useState(0);
    const [ended, setEnded] = useState(false);
    const [fullscreenAvailable, setFullscreenAvailable] = useState(false);
    const [fullscreen, setFullscreen] = useState(false);
    const controlsRef = useRef(null);

    useEffect(() => {
      const video = videoRef.current;
      if (!video) return undefined;

      // Gallery recordings always remain audible; this is intentionally not a user-facing toggle.
      video.muted = false;
      video.defaultMuted = false;
      video.volume = 1;

      const sync = () => {
        const nextDuration = Number.isFinite(video.duration) ? video.duration : 0;
        setCurrent(Number.isFinite(video.currentTime) ? video.currentTime : 0);
        setDuration(nextDuration);
        setPlaying(!video.paused && !video.ended);
        setEnded(video.ended);
      };
      const syncPlaying = () => {
        setPlaying(!video.paused && !video.ended);
        setEnded(video.ended);
      };
      const syncFullscreen = () => {
        setFullscreen(Boolean(
          document.fullscreenElement === video.parentElement
          || document.webkitFullscreenElement === video.parentElement
          || video.webkitDisplayingFullscreen
        ));
      };

      setFullscreenAvailable(Boolean(
        typeof video.parentElement?.requestFullscreen === "function"
        || typeof video.parentElement?.webkitRequestFullscreen === "function"
        || typeof video.webkitEnterFullscreen === "function"
      ));
      sync();
      video.addEventListener("loadedmetadata", sync);
      video.addEventListener("durationchange", sync);
      video.addEventListener("timeupdate", sync);
      video.addEventListener("progress", sync);
      video.addEventListener("play", syncPlaying);

.mission-guide {
  --guide-accent: #82e8df;
  --speech-level: 0;
  --speech-opacity: .48;
  position: absolute;
  top: 108px;
  left: 14px;
  z-index: 8;
  width: min(370px, calc(100% - 28px));
  color: #eef7ff;
  font-family: inherit;
  pointer-events: none;
}

.mission-guide__card {
  display: flex;
  min-height: 128px;
  overflow: hidden;
  border: 1px solid rgba(207, 231, 244, .2);
  border-radius: 18px;
  background: linear-gradient(112deg, rgba(8, 15, 28, .94), rgba(12, 22, 38, .84) 67%, rgba(7, 13, 25, .9));
  box-shadow: 0 18px 44px rgba(0, 0, 0, .42), inset 0 1px 0 rgba(255, 255, 255, .07), 0 0 0 1px rgba(8, 14, 26, .42);
  backdrop-filter: blur(18px) saturate(1.18);
  pointer-events: auto;
  isolation: isolate;
}

.mission-guide__card::before {
  position: absolute;
  inset: 0;
  z-index: -1;
  border-radius: inherit;
  background: radial-gradient(circle at 11% 36%, color-mix(in srgb, var(--guide-accent) 20%, transparent), transparent 38%);
  content: "";
  opacity: .55;
  pointer-events: none;
}

.mission-guide__avatar {
  position: relative;
  flex: 0 0 98px;
  width: 98px;
  min-height: 120px;
  overflow: hidden;
  display: grid;
  place-items: end center;
  align-self: stretch;
  background: radial-gradient(circle at 50% 52%, rgba(124, 232, 225, .13), transparent 62%);
}

.mission-guide__avatar::after {
  position: absolute;
  right: 10px;
  bottom: 10px;
  left: 10px;
  height: 13px;
  border-radius: 50%;
  background: radial-gradient(ellipse, rgba(1, 6, 14, .6), transparent 70%);
  content: "";
  filter: blur(3px);
}

.mission-guide__avatar img,
.mission-guide__robot {
  position: relative;
  z-index: 1;
  display: block;
  width: 98px;
  height: 120px;
  object-fit: contain;
  object-position: center bottom;
  filter: drop-shadow(0 8px 10px rgba(0, 0, 0, .4));
  animation: mission-guide-float 5.8s ease-in-out infinite;
}

.mission-guide__robot {
  padding: 3px 3px 0;
}

.mission-guide__signal {
  position: absolute;
  top: 39px;
  right: 8px;
  z-index: 2;
  display: flex;
  gap: 3px;
  align-items: flex-end;
  width: 20px;
  height: 22px;
  opacity: var(--speech-opacity);
  transition: opacity .22s ease;
}

.mission-guide__signal i {
  display: block;
  width: 3px;
  height: 36%;
  border-radius: 4px;
  background: var(--guide-accent);
  box-shadow: 0 0 7px color-mix(in srgb, var(--guide-accent) 70%, transparent);
  transform-origin: bottom;
}

.mission-guide__signal i:nth-child(2) { height: 70%; }
.mission-guide__signal i:nth-child(3) { height: 50%; }
.mission-guide[data-mode="speaking"] .mission-guide__signal i {
  transform: scaleY(calc(.72 + var(--speech-level) * .55));
}

.mission-guide__content {
  min-width: 0;
  flex: 1;
  padding: 11px 11px 10px 5px;
}

.mission-guide__topline {
  display: flex;
  align-items: flex-start;
  gap: 6px;
}

.mission-guide__identity {
  min-width: 0;
  flex: 1;
}

.mission-guide__label,
.mission-guide__fact-label {
  display: block;
  color: rgba(185, 214, 236, .66);
  font-size: 8px;
  font-weight: 800;
  letter-spacing: .15em;
  line-height: 1.2;
  text-transform: uppercase;
}

.mission-guide__name {
  display: block;
  overflow: hidden;
  margin-top: 3px;
  color: #f3f8fc;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: -.01em;
  line-height: 1.15;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.mission-guide__close {
  display: grid;
  flex: 0 0 24px;
  width: 24px;
  height: 24px;
  margin: -3px -2px 0 0;
  padding: 0;
  place-items: center;
  border: 1px solid rgba(255, 255, 255, .14);
  border-radius: 50%;
  color: rgba(232, 245, 252, .74);
  background: rgba(255, 255, 255, .055);
  cursor: pointer;
  transition: border-color .2s ease, background .2s ease, color .2s ease;
}

.mission-guide__close:hover,
.mission-guide__close:focus-visible {
  border-color: var(--guide-accent);
  color: #fff;
  background: rgba(255, 255, 255, .12);
}

.mission-guide__close svg {
  width: 13px;
  height: 13px;
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-width: 1.6;
}

.mission-guide__status {
  display: flex;
  align-items: center;
  gap: 5px;
  min-height: 17px;
  margin-top: 4px;
  color: rgba(213, 231, 244, .72);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .07em;
  text-transform: uppercase;
}

.mission-guide__status-dot,
.mission-guide__reopen-dot {
  display: inline-block;
  width: 5px;
  height: 5px;
  flex: 0 0 5px;
  border-radius: 50%;
  background: var(--guide-accent);
  box-shadow: 0 0 8px var(--guide-accent);
}

.mission-guide[data-mode="speaking"] .mission-guide__status-dot {
  box-shadow: 0 0 calc(7px + 9px * var(--speech-level)) var(--guide-accent);
}

.mission-guide__bars {
  display: flex;
  align-items: flex-end;
  gap: 2px;
  width: 24px;
  height: 12px;
  margin-left: 2px;
}

.mission-guide__bars i {
  display: block;
  width: 2px;
  min-height: 2px;
  border-radius: 2px;
  background: var(--guide-accent);
  opacity: var(--speech-opacity);
  transition: height .18s ease, opacity .2s ease;
}

.mission-guide__fact {
  min-width: 0;
  margin-top: 5px;
  padding: 5px 7px 6px;
  border-left: 2px solid color-mix(in srgb, var(--guide-accent) 70%, transparent);
  background: rgba(255, 255, 255, .045);
}

.mission-guide__fact-text {
  display: block;
  overflow: hidden;
  margin-top: 2px;
  color: rgba(241, 247, 252, .92);
  font-size: 10px;
  font-weight: 600;
  line-height: 1.25;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.mission-guide__follow {
  overflow: hidden;
  margin: 4px 0 0;
  color: var(--guide-accent);
  font-size: 9px;
  font-weight: 700;
  line-height: 1.2;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.mission-guide__controls {
  display: flex;
  gap: 6px;
  margin-top: 7px;
}

.mission-guide__play,
.mission-guide__replay {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  min-height: 27px;
  border-radius: 8px;
  cursor: pointer;
  font: inherit;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .04em;
  transition: transform .2s ease, background .2s ease, border-color .2s ease;
}

.mission-guide__play {
  min-width: 76px;
  padding: 5px 9px;
  border: 1px solid transparent;
  color: #06111a;
  background: var(--guide-accent);
  box-shadow: 0 5px 13px rgba(0, 0, 0, .22);
}

.mission-guide__replay {
  padding: 5px 8px;
  border: 1px solid rgba(211, 232, 243, .18);
  color: rgba(239, 247, 252, .86);
  background: rgba(255, 255, 255, .055);
}

.mission-guide__play:hover,
.mission-guide__replay:hover {
  transform: translateY(-1px);
}

.mission-guide__play:hover { filter: brightness(1.08); }
.mission-guide__replay:hover { border-color: rgba(211, 232, 243, .4); background: rgba(255, 255, 255, .11); }

.mission-guide__play svg,
.mission-guide__replay svg {
  width: 13px;
  height: 13px;
  fill: currentColor;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 1.5;
}

.mission-guide__play svg path:first-child + path,
.mission-guide__replay svg { fill: none; }

.mission-guide__reopen {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  min-height: 29px;
  padding: 5px 10px;
  border: 1px solid rgba(211, 232, 243, .2);
  border-radius: 999px;
  color: rgba(239, 247, 252, .84);
  background: rgba(8, 15, 28, .86);
  box-shadow: 0 12px 28px rgba(0, 0, 0, .35);
  backdrop-filter: blur(16px);
  cursor: pointer;
  font: inherit;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .12em;
  pointer-events: auto;
  transition: border-color .2s ease, background .2s ease, transform .2s ease;
}

.mission-guide__reopen:hover,
.mission-guide__reopen:focus-visible {
  border-color: var(--guide-accent);
  background: rgba(15, 29, 46, .96);
  transform: translateY(-1px);
}

.mission-guide button:focus-visible {
  outline: 2px solid var(--guide-accent);
  outline-offset: 2px;
}

@keyframes mission-guide-float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

@media (max-width: 1023px) {
  .mission-guide {
    top: 147px;
    left: 14px;

  }

  .mission-guide__card {
    min-height: 80px;
    border-radius: 14px;
  }

  .mission-guide__avatar img,

    width: 52px;
    height: 72px;
  }

  .mission-guide__avatar::after { right: 5px; bottom: 5px; left: 5px; height: 8px; }

  .mission-guide__content { padding: 7px 8px 7px 4px; }
  .mission-guide__label,
  .mission-guide__fact-label { font-size: 6.5px; letter-spacing: .1em; }
  .mission-guide__name { margin-top: 2px; font-size: 12px; }
  .mission-guide__close { width: 21px; height: 21px; flex-basis: 21px; }
  .mission-guide__status { min-height: 13px; margin-top: 2px; font-size: 7px; }
  .mission-guide__status-dot,
  .mission-guide__reopen-dot { width: 4px; height: 4px; flex-basis: 4px; }
  .mission-guide__fact { margin-top: 2px; padding: 3px 5px 4px; }
  .mission-guide__fact-text { margin-top: 1px; font-size: 8px; }
  .mission-guide__follow { margin-top: 2px; font-size: 7.5px; }
  .mission-guide__controls { gap: 4px; margin-top: 4px; }
  .mission-guide__play,
  .mission-guide__replay { min-height: 22px; padding: 3px 6px; font-size: 7.5px; }
  .mission-guide__play { min-width: 59px; }
  .mission-guide__play svg,
  .mission-guide__replay svg { width: 11px; height: 11px; }
}

@media (prefers-reduced-motion: reduce) {
  .mission-guide__avatar img,
  .mission-guide__robot,
  .mission-guide__play,
  .mission-guide__replay,
  .mission-guide__reopen { animation: none; transition: none; }
  .mission-guide__bars i,
  .mission-guide__signal i { transition: none; }
}

}

                  {!en && captionsOn && <div className="voice-transcript-readable mt-3" dir="ltr"><p className="craft-eyebrow">English transcript</p><p>{mission.enDiary}</p></div>}
                  <div className="mt-4 flex gap-2 flex-wrap">
                    <button onClick={speak} className="accbg rounded-full px-5 py-2 font-bold flex items-center gap-2">{speaking ? <Pause size={16} /> : <Volume2 size={16} />} {speaking ? (en ? "Pause" : "إيقاف مؤقت") : (audioRef.current && voiceId === mission.id ? (en ? "Resume" : "استئناف") : t("listen"))}</button>
                    <button className="voice-transcript-toggle" onClick={() => setCaptionsOn(!captionsOn)} aria-pressed={captionsOn}>EN captions / النص الإنجليزي</button>
                    <button onClick={() => { play("click"); setLm(0); }} className={btn}><Wind size={16} /> {t("last")}</button>
                  </div>
                  {speaking && voiceId === mission.id && captionsOn && voiceCue && <div className="voice-caption mt-3" dir="ltr"><span className="voice-caption__label">{voiceCue.untimed ? "English transcript · awaiting matched narration timing" : "English caption"}</span>{voiceCue.text}</div>}
                  {notice && <p className="mt-2 text-sm text-amber-300">{notice}</p>}
                  {mission.id === "voy" && <LightDayCountdown />}
                </div>
                <dl className="md:col-span-2 grid gap-2 content-start">
                  {SL[lang].map((k, i) => <div key={k} className="bg-black/30 rounded-xl px-3 py-2"><dt className="text-xs text-slate-400">{k}</dt><dd className="font-bold text-sm" dir="rtl">{mission.s[i]}</dd></div>)}
                </dl>
                <p className="md:col-span-5 text-xs text-slate-400" dir="rtl">{VER[mission.id] ? <>✓ الأرقام راجعتها على مصدر رسمي: <a href={VER[mission.id]} target="_blank" rel="noreferrer" className="acc underline">المصدر</a></> : "⏳ أرقام هذه المركبة قيد المراجعة على مصادر ناسا"}</p>
              </div>)}
            {tab === "blue" && (
              <div className="grid md:grid-cols-2 gap-4">
                <div className="relative h-64 bg-black/30 rounded-xl">
                  <svg viewBox="0 0 100 100" className="absolute inset-0 w-full h-full" aria-hidden><rect x="35" y="38" width="30" height="24" rx="4" fill="none" stroke="var(--c)" strokeWidth="1.5" /><line x1="35" y1="45" x2="22" y2="28" stroke="var(--c)" /><line x1="65" y1="45" x2="78" y2="28" stroke="var(--c)" /><line x1="38" y1="62" x2="25" y2="76" stroke="var(--c)" /><line x1="62" y1="62" x2="78" y2="76" stroke="var(--c)" /></svg>
                  {PART_META.map((p, i) => { const Ic = p.ic; return <button key={i} onClick={() => { play("click"); setPart(i); }} aria-label={p.k} style={{ left: `${p.pos[0]}%`, top: `${p.pos[1]}%` }} className={`absolute -translate-x-1/2 -translate-y-1/2 w-11 h-11 rounded-full grid place-items-center border-2 accbd transition ${part === i ? "accbg scale-110" : "bg-[#05070d]"}`}><Ic size={18} /></button>; })}
                </div>
                <div className="bg-black/30 rounded-xl p-4" dir="rtl">
                  {part === null ? <p className="text-slate-300">{t("tap")}</p> : <><h3 className="font-extrabold acc">{PART_META[part].k}</h3><p className="mt-2 font-bold text-sm">{t("how")}</p><p className="leading-loose">{how}</p><p className="mt-2 font-bold text-sm">{t("why")}</p><p className="leading-loose">{why}</p></>}
                </div>
              </div>)}
            {tab === "sim" && (
              <div className="max-w-xl">
                <label className="font-bold">{t("dust")}: {dust}%</label>
                <input type="range" min="0" max="100" value={dust} onChange={(e) => setDust(+e.target.value)} className="w-full mt-2" style={{ accentColor: B.c }} />
                <p className="mt-4 font-bold">{t("power")}: {power}%</p>
                <div className="h-5 rounded-full bg-black/40 overflow-hidden mt-1"><div className="h-full transition-all" style={{ width: `${power}%`, background: power > 30 ? "linear-gradient(90deg,#34d399,#fde047)" : "#ef4444", boxShadow: "0 0 18px currentColor" }} /></div>
                {power < 12 && <button onClick={() => setLm(0)} className="mt-4 accbg rounded-full px-5 py-2 font-bold flex items-center gap-2"><Wind size={16} /> {t("last")}</button>}
              </div>)}
            {tab === "lesson" && (
              <div className="max-w-2xl"><p className="acc font-bold flex items-center gap-2"><Lightbulb size={18} /> {t("lesNote")}</p><p className="mt-3 text-xl leading-loose">{LESSON[mission.id][en ? 1 : 0]}</p></div>)}
          </div>
        </aside>
      )}

      {/* LAST MESSAGE */}
      {lm >= 0 && mission && (
        <div className="fixed inset-0 z-[70] bg-black grid place-items-center p-6 text-center" style={{ transition: "background 2s" }}>
          <div className="space-y-5">{lmLines.slice(0, lm + 1).map((l, i) => <p key={i} className="fin text-xl sm:text-3xl font-bold" style={{ opacity: 1 - i * 0.12 }}>{l}</p>)}</div>
          <button onClick={() => setLm(-1)} className={btn + " absolute bottom-8"}><X size={16} /> {en ? "Close" : "إغلاق"}</button>
        </div>)}

      {/* MODALS */}
      {modal && (
        <div className="fixed inset-0 z-50 bg-black/70 grid place-items-center p-4" role="dialog" aria-modal="true">
          <div className="glass bg-[#0d1220] rounded-2xl p-5 w-full max-w-2xl max-h-[85vh] overflow-y-auto relative">
            <button onClick={() => setModal(null)} aria-label="close" className="absolute top-3 end-3"><X size={20} /></button>
            {modal === "time" && <><h2 className="text-xl font-extrabold flex items-center gap-2"><Clock size={20} className="acc" /> {t("time")}: {year}</h2>
              <input type="range" min="1960" max="2026" value={year} onChange={(e) => setYear(+e.target.value)} className="w-full mt-3" style={{ accentColor: "#8bd3ff" }} />
              <ol className="mt-3 grid sm:grid-cols-2 gap-2">{timeline.map((m) => <li key={m.id}><button onClick={() => { setModal(null); setView(m.b); openMission(m.id); play("planet"); }} className="w-full text-start bg-black/30 hover:bg-black/50 rounded-xl p-3"><b className="acc">{m.y}</b> <b>{nm(m)}</b><span className="block text-xs text-slate-400">{bn(m.b)}</span></button></li>)}</ol></>}
            {modal === "src" && <><h2 className="text-xl font-extrabold flex items-center gap-2"><Database size={20} className="acc" /> {t("src")}</h2>
              <ul className="mt-3 space-y-2" dir="ltr">{SRC.map(([n, u]) => <li key={u}><a href={u} target="_blank" rel="noreferrer" className="acc underline">{n}</a></li>)}</ul><p className="mt-4 text-sm text-slate-400">{t("srcNote")}</p></>}
            {modal === "intro" && <div className="intro-transcript-panel" dir="ltr"><h2 className="text-xl font-extrabold">Transcript / النص</h2><p className="mt-1 text-sm text-slate-400">English transcript of the opening narration</p><p className="mt-4 text-lg leading-loose">{window.INTRO_NARRATION?.text || "Don't worry, we haven't forgotten you."}</p></div>}
            {modal === "quiz" && (!done ? <><h2 className="text-xl font-extrabold flex items-center gap-2"><Trophy size={20} className="acc" /> {t("quiz")}</h2>
              <p className="mt-2 text-sm text-slate-400">{qi + 1}/{QUIZ.length} · {score}</p><p className="mt-2 text-lg font-bold" dir="rtl">{QUIZ[qi].q}</p>
              <div className="mt-3 grid gap-2" dir="rtl">{QUIZ[qi].o.map((o, i) => { const r = pick !== null && i === QUIZ[qi].a, w = pick === i && i !== QUIZ[qi].a; return <button key={i} onClick={() => answer(i)} className={`rounded-xl px-4 py-3 text-start border ${r ? "bg-emerald-600/40 border-emerald-400" : w ? "bg-red-600/40 border-red-400" : "bg-black/30 border-white/10 hover:bg-black/50"}`}>{o}</button>; })}</div>
              {pick !== null && <button onClick={next} className="mt-3 accbg rounded-full px-5 py-2 font-bold">{qi === QUIZ.length - 1 ? "✓" : "→"}</button>}</> :
              <div className="text-center py-3"><Award size={64} className="mx-auto acc" /><h3 className="mt-2 text-2xl font-extrabold">{score >= 3 ? (en ? "Certified Solar System Archaeologist" : "شارة مستكشف آثار الفضاء") : (en ? "Try again" : "حاول مرة أخرى")}</h3>
                <p className="mt-2">{score} / {QUIZ.length}</p>
                {score >= 3 && <div className="mt-4 flex gap-2 justify-center flex-wrap"><input value={name} onChange={(e) => setName(e.target.value)} placeholder={t("name")} className="rounded-full px-4 py-2 bg-black/40 border border-white/20 text-center" /><button onClick={() => makeCert(name, score, lang)} className="accbg rounded-full px-5 py-2 font-bold flex items-center gap-2"><Download size={16} /> {t("get")}</button></div>}
                <button onClick={reset} className={btn + " mx-auto mt-3"}><Rocket size={16} /> {en ? "Again" : "أعد الاختبار"}</button></div>)}
          </div>
        </div>)}
      </div>

      {introVisible && (
        <window.CinematicIntro
          lang={lang}
          onFirstInteraction={unlockAudio}
          onMusicLeadIn={beginMusicLeadIn}
          onBeginTransition={beginIntroTransition}
          onComplete={() => setIntroVisible(false)}
          onLanguageToggle={() => setLang(en ? "ar" : "en")}
          voiceSource={INTRO_VOICE}
        />
      )}
      {/* The film is optional now, so it must always be closable. */}
      {introVisible && (
        <button
          onClick={() => { setIntroVisible(false); try { ambient(true); } catch (e) {} }}
          aria-label={en ? "Close the film and return to the exhibit" : "إغلاق الفيلم والعودة إلى المعرض"}
          style={{ position: "fixed", top: 14, left: 14, zIndex: 2147483600, display: "flex", alignItems: "center", gap: 6, padding: "8px 14px", borderRadius: 999, border: "1px solid rgba(139,211,255,.35)", background: "rgba(5,7,13,.55)", color: "#e8f0fe", fontWeight: 700, fontSize: 13, backdropFilter: "blur(12px)", cursor: "pointer" }}
        >
          <X size={15} /> {en ? "Close" : "إغلاق"}
        </button>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
// Last resort: a render failure shows a recovery card instead of a silent blank screen.
class AppBoundary extends React.Component {
  constructor(props) { super(props); this.state = { failed: false }; }
  static getDerivedStateFromError() { return { failed: true }; }
  componentDidCatch() {}
  render() {
    if (!this.state.failed) return this.props.children;
    return (
      <div dir="rtl" style={{ position: "fixed", inset: 0, display: "grid", placeContent: "center", gap: 14, textAlign: "center", padding: 24, background: "#05070d", color: "#e8f0fe", fontFamily: "'Tajawal','Segoe UI',sans-serif" }}>
        <p style={{ fontSize: 18, fontWeight: 800 }}>تعذّر عرض هذه الشاشة.</p>
        <p style={{ fontSize: 13, color: "#9db4d0" }}>This screen could not be displayed. Nothing else was affected.</p>
        <button onClick={() => window.location.reload()} style={{ justifySelf: "center", padding: "10px 20px", borderRadius: 999, background: "#8bd3ff", color: "#05070d", fontWeight: 800 }}>إعادة التحميل / Reload</button>
      </div>
    );
  }
}
root.render(<AppBoundary><ForgottenExplorers /></AppBoundary>);

  </script>
  <!-- The block above is the readable source. Browsers run ./app.js, which

  <script src="./app.js"></script>
