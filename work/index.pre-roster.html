    if (!window.storage) {

          try {

            return val !== null ? { value: val } : null;
          } catch (e) {
            return null;
          }
        },

          try {

            {tab === "sim" && (
              <div className="max-w-xl">
                <label className="font-bold">{t("dust")}: {dust}%</label>
                <input type="range" min="0" max="100" value={dust} onChange={(e) => setDust(+e.target.value)} className="w-full mt-2" style={{ accentColor: B.c }} />
                <p className="mt-4 font-bold">{t("power")}: {power}%</p>
                <div className="h-5 rounded-full bg-black/40 overflow-hidden mt-1"><div className="h-full transition-all" style={{ width: `${power}%`, background: power > 30 ? "linear-gradient(90deg,#34d399,#fde047)" : "#ef4444", boxShadow: "0 0 18px currentColor" }} /></div>
                {power < 12 && <button onClick={() => setLm(0)} className="mt-4 accbg rounded-full px-5 py-2 font-bold flex items-center gap-2"><Wind size={16} /> {t("last")}</button>}
              </div>)}
            {tab === "lesson" && (
              <div className="max-w-2xl"><p className="acc font-bold flex items-center gap-2"><Lightbulb size={18} /> {t("lesNote")}</p><p className="mt-3 text-xl leading-loose">{LESSON[mission.id][en ? 1 : 0]}</p></div>)}
          </div>
        </aside>
      )}

      {/* LAST MESSAGE */}
      {lm >= 0 && mission && (
        <div className="fixed inset-0 z-[70] bg-black grid place-items-center p-6 text-center" style={{ transition: "background 2s" }}>
          <div className="space-y-5">{lmLines.slice(0, lm + 1).map((l, i) => <p key={i} className="fin text-xl sm:text-3xl font-bold" style={{ opacity: 1 - i * 0.12 }}>{l}</p>)}</div>
          <button onClick={() => setLm(-1)} className={btn + " absolute bottom-8"}><X size={16} /> {en ? "Close" : "إغلاق"}</button>
        </div>)}

      {/* MODALS */}
      {modal && (
        <div className="fixed inset-0 z-50 bg-black/70 grid place-items-center p-4" role="dialog" aria-modal="true">
          <div className="glass bg-[#0d1220] rounded-2xl p-5 w-full max-w-2xl max-h-[85vh] overflow-y-auto relative">
            <button onClick={() => setModal(null)} aria-label="close" className="absolute top-3 end-3"><X size={20} /></button>
            {modal === "time" && <><h2 className="text-xl font-extrabold flex items-center gap-2"><Clock size={20} className="acc" /> {t("time")}: {year}</h2>
              <input type="range" min="1960" max="2026" value={year} onChange={(e) => setYear(+e.target.value)} className="w-full mt-3" style={{ accentColor: "#8bd3ff" }} />
              <ol className="mt-3 grid sm:grid-cols-2 gap-2">{timeline.map((m) => <li key={m.id}><button onClick={() => { setModal(null); setView(m.b); openMission(m.id); play("planet"); }} className="w-full text-start bg-black/30 hover:bg-black/50 rounded-xl p-3"><b className="acc">{m.y}</b> <b>{nm(m)}</b><span className="block text-xs text-slate-400">{bn(m.b)}</span></button></li>)}</ol></>}
            {modal === "src" && <><h2 className="text-xl font-extrabold flex items-center gap-2"><Database size={20} className="acc" /> {t("src")}</h2>
              <ul className="mt-3 space-y-2" dir="ltr">{SRC.map(([n, u]) => <li key={u}><a href={u} target="_blank" rel="noreferrer" className="acc underline">{n}</a></li>)}</ul><p className="mt-4 text-sm text-slate-400">{t("srcNote")}</p></>}
            {modal === "intro" && <div className="intro-transcript-panel" dir="ltr"><h2 className="text-xl font-extrabold">Transcript / النص</h2><p className="mt-1 text-sm text-slate-400">English transcript of the opening narration</p><p className="mt-4 text-lg leading-loose">{window.INTRO_NARRATION?.text || "Don't worry, we haven't forgotten you."}</p></div>}
            {modal === "quiz" && (!done ? <><h2 className="text-xl font-extrabold flex items-center gap-2"><Trophy size={20} className="acc" /> {t("quiz")}</h2>
              <p className="mt-2 text-sm text-slate-400">{qi + 1}/{QUIZ.length} · {score}</p><p className="mt-2 text-lg font-bold" dir="rtl">{QUIZ[qi].q}</p>
              <div className="mt-3 grid gap-2" dir="rtl">{QUIZ[qi].o.map((o, i) => { const r = pick !== null && i === QUIZ[qi].a, w = pick === i && i !== QUIZ[qi].a; return <button key={i} onClick={() => answer(i)} className={`rounded-xl px-4 py-3 text-start border ${r ? "bg-emerald-600/40 border-emerald-400" : w ? "bg-red-600/40 border-red-400" : "bg-black/30 border-white/10 hover:bg-black/50"}`}>{o}</button>; })}</div>
              {pick !== null && <button onClick={next} className="mt-3 accbg rounded-full px-5 py-2 font-bold">{qi === QUIZ.length - 1 ? "✓" : "→"}</button>}</> :
              <div className="text-center py-3"><Award size={64} className="mx-auto acc" /><h3 className="mt-2 text-2xl font-extrabold">{score >= 3 ? (en ? "Certified Solar System Archaeologist" : "شارة مستكشف آثار الفضاء") : (en ? "Try again" : "حاول مرة أخرى")}</h3>
                <p className="mt-2">{score} / {QUIZ.length}</p>
                {score >= 3 && <div className="mt-4 flex gap-2 justify-center flex-wrap"><input value={name} onChange={(e) => setName(e.target.value)} placeholder={t("name")} className="rounded-full px-4 py-2 bg-black/40 border border-white/20 text-center" /><button onClick={() => makeCert(name, score, lang)} className="accbg rounded-full px-5 py-2 font-bold flex items-center gap-2"><Download size={16} /> {t("get")}</button></div>}
                <button onClick={reset} className={btn + " mx-auto mt-3"}><Rocket size={16} /> {en ? "Again" : "أعد الاختبار"}</button></div>)}
          </div>
        </div>)}
      </div>

      {introVisible && (
        <window.CinematicIntro
          lang={lang}
          muted={muted}
          onMutedChange={setAppMuted}
          onFirstInteraction={unlockAudio}
          onBeginTransition={beginIntroTransition}
          onComplete={() => setIntroVisible(false)}
          onLanguageToggle={() => setLang(en ? "ar" : "en")}
          voiceSource={INTRO_VOICE}
        />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ForgottenExplorers />);

  </script>
</body>
</html>
